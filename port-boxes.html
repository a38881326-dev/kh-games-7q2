<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صناديق الميناء</title>
<style>
:root{
  --bg:#eef6fb; --ink:#13324a; --muted:#56718a; --card:#ffffff; --line:#cfe1ee;
  --accent:#1f6fa8; --accent-dark:#164f7a; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e2f4e7; --bad:#a3302a; --bad-bg:#fbe5e2; --hint-bg:#fff1d6; --hint-ink:#8a4d00;
  --b1:#e6f5ea; --b2:#e8eefc; --b3:#fff3df;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:clamp(17px,2vw,28px);line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;font-size:inherit}
.noscript{background:#fff1d6;color:#8a4d00;text-align:center;padding:.5em;font-weight:700;border-bottom:2px solid #f0c27a}
.wrap{max-width:1400px;margin:0 auto;padding:clamp(10px,1.6vw,24px) 16px 24px;display:flex;flex-direction:column;gap:clamp(8px,1.2vw,16px);min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:700}
.steps{display:flex;gap:6px}
.steps span{width:clamp(28px,3.4vw,44px);height:clamp(28px,3.4vw,44px);border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-size:.75em}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.done{background:var(--ok-bg);border-color:var(--ok)}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(12px,2vw,28px);box-shadow:0 6px 18px rgba(19,50,74,.08)}
.scene-head{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h1{font-size:1.8em;margin:.1em 0}
h2{font-size:1.3em;margin:0}
.lead{color:var(--muted);margin:.15em 0 .5em}
.q{font-size:1.2em;font-weight:700;margin:.35em 0}
.opts{display:grid;gap:clamp(8px,1vw,12px)}
.opt{display:flex;align-items:center;gap:.6em;text-align:right;background:#f8fbfe;border:3px solid var(--line);border-radius:18px;padding:.35em .7em;min-height:58px;font-size:1.05em}
.opt .letter{flex:0 0 auto;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
.opt .mark{margin-inline-start:auto;font-weight:700}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt[disabled]{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.feedback{border-radius:16px;padding:.5em .8em;font-weight:700;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback.hint{background:var(--hint-bg);color:var(--hint-ink)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:.4em 1.2em;min-height:58px;font-weight:700}
.btn:hover{background:var(--accent-dark)}
.btn.outline{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,111,168,.5)}50%{box-shadow:0 0 0 10px rgba(31,111,168,0)}}

/* drawn pictures (svg, offline) */
.pic{position:relative;border-radius:18px;overflow:hidden;background:#dfeefa}
.pic > svg{display:block;width:100%;height:100%}
.scene-pic{aspect-ratio:8/3;max-height:34vh;width:100%;margin:.2em 0 .4em}
.port-pic{aspect-ratio:640/170;max-height:24vh;width:100%}
.caption{text-align:center;font-weight:700;color:var(--accent-dark);font-size:.8em;margin:.15em 0 .3em}

/* svg animation */
.walk{animation:walk 9s linear infinite}
@keyframes walk{from{transform:translateX(160px)}to{transform:translateX(-160px)}}
.page{animation:fall 2.6s ease-in infinite}
.page.p2{animation-delay:.9s}.page.p3{animation-delay:1.7s}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:0}25%{opacity:1}100%{transform:translateY(70px) rotate(40deg);opacity:0}}
.sail{animation:sail 7s ease-in-out infinite}
@keyframes sail{0%,100%{transform:translateX(40px)}50%{transform:translateX(-40px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.fly{animation:fly 6s linear infinite}
@keyframes fly{from{transform:translateX(260px)}to{transform:translateX(-420px)}}
.wave{animation:wave 3s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.arrive{animation:arrive 5s ease-out infinite}
@keyframes arrive{0%{transform:translateX(-180px)}60%,100%{transform:translateX(0)}}
.leave{animation:leave 5s ease-in infinite}
@keyframes leave{0%,30%{transform:translateX(0)}100%{transform:translateX(-260px)}}
@media (prefers-reduced-motion:reduce){.walk,.page,.sail,.bob,.fly,.wave,.arrive,.leave{animation:none}}

/* drag scenes */
.boxes{display:flex;flex-wrap:wrap;gap:clamp(8px,1vw,14px);justify-content:center;min-height:2.4em;padding:.2em 0}
.boxitem{touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(#fffaf0,#f6e7cc);border:2px solid #d9b77f;border-radius:14px;padding:.2em .6em .2em .8em;min-height:60px;display:flex;align-items:center;gap:.4em;font-weight:700;box-shadow:0 4px 0 #c99a55,0 6px 12px rgba(0,0,0,.12);cursor:grab}
.carton{position:relative;width:2.6em;height:2.2em;flex:0 0 auto}
.carton svg{width:100%;height:100%;display:block}
.carton .e{position:absolute;right:30%;left:6%;top:40%;text-align:center;font-size:.75em;line-height:1}
.boxitem.picked{outline:4px solid var(--accent);outline-offset:2px}
.boxitem.dragclone{position:fixed;z-index:50;pointer-events:none;opacity:.95;transform:translate(-50%,-50%) rotate(-4deg) scale(1.05);cursor:grabbing;margin:0}
.boxitem.placeholder{opacity:.3}
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1vw,14px)}
.basket{border:3px dashed var(--line);border-radius:20px;padding:.3em;min-height:clamp(130px,16vw,220px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15em;transition:transform .1s}
.basket.b1{background:var(--b1)} .basket.b2{background:var(--b2)} .basket.b3{background:var(--b3)}
.basket .bimg{width:clamp(48px,6vw,84px);height:auto}
.basket .t{font-weight:700;font-size:1.1em}
.basket .s{font-size:.6em;color:var(--muted);line-height:1.3}
.basket.over{border-style:solid;border-color:var(--accent);transform:scale(1.02)}
.basket .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:auto}
.basket .in span{background:#fff;border:2px solid var(--ok);border-radius:10px;padding:0 .35em;font-size:.7em}

/* golden */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.product{border:2px solid var(--line);border-radius:18px;padding:.5em;background:#f8fbfe;display:flex;flex-direction:column;gap:.35em}
.product .pic{aspect-ratio:4/3;background:linear-gradient(#f3f8fc,#dcebf6)}
.product .co{font-weight:700}
.product .item{font-size:.85em;color:var(--muted)}
.product input{border:2px solid var(--line);border-radius:12px;padding:.25em .5em;font-size:.9em;width:100%;background:#fff;color:var(--ink)}
.product .row{display:flex;gap:6px;flex-wrap:wrap}
.product .row button{flex:1 1 45%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:.8em;padding:.2em .4em}
.product .msg{font-size:.75em;font-weight:700;min-height:1.4em}
.product .msg.ok{color:var(--ok)}
.small{font-size:.7em;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.summary div{border-radius:16px;padding:.5em;border:2px solid var(--line)}
.hidden{display:none !important}
@media (max-width:640px){
  .baskets,.summary{grid-template-columns:1fr}
  .basket{min-height:90px;flex-direction:row;flex-wrap:wrap;justify-content:center}
  .basket .bimg{width:44px}
  .basket .in{margin-top:0;width:100%}
  .scene-pic{aspect-ratio:16/9}
}
</style>
</head>

(function(){

  var ART = {

      '<path d="M0 206 Q170 166 330 196 T640 186 V240 H0Z" fill="url(#gDuneF)"/>'+
      '<path d="M40 214 q20 -6 40 0 M420 222 q24 -7 48 0" stroke="#c99556" stroke-width="2" fill="none" opacity=".6"/>'+
      '<g class="walk"><path d="M200 168 L290 168 M330 168 L410 168" stroke="#7a4b1c" stroke-width="1.5" stroke-dasharray="3 3"/>'+
        use("camel",150,110,120,100)+use("camel",270,112,116,96)+use("camel",385,114,112,93)+'</g>'+

      '</svg>'
  };
  var BASKETS = [
    {id:"get", cls:"b1", t:"📥 نحصل", s:"على منتجات يصعب توافرها في وطننا"},
    {id:"use", cls:"b2", t:"🔧 نستفيد", s:"من صناعات الدول الأخرى"},
    {id:"sell", cls:"b3", t:"📤 نبيع", s:"إنتاجنا الوطني"}
  ];
  var WHY = {
    get:"نحصل من دول أخرى على منتجات كثيرة يصعب توافرها في وطننا، مثل بعض الفواكه والخضراوات (ص101).",
    use:"نستفيد من صناعات بعض الدول الأخرى، مثل الأجهزة الإلكترونية، والسيارات (ص101).",
    sell:"نبيع إنتاجنا الوطني، مثل النفط ومشتقاته، والتمور (ص101)."
  };
  /* شركات أغذية سعودية اختارتها المعلمة (المصادر في 04-sharara.md). نص فقط، ورسوم عامة بلا شعار ولا ألوان علامة تجارية */
  var PRODUCTS = [
    {co:"السعودية", item:"معجون الطماطم", art:"paste"},
    {co:"المراعي", item:"الحليب الطازج", art:"milk"},
    {co:"حلواني إخوان", item:"منتجات اللحوم المعلّبة", art:"tin"},
    {co:"", item:"", art:"bag", open:true}
  ];
  var SCENES = [
    {type:"start"},
    {type:"mcq", icon:"🐪", title:"أمس: القافلة", lead:"انظري إلى قافلة الجمال في الرسم.",  art:"caravan",
     q:"كم كان يستغرق التبادل التجاري قديماً؟",
     options:["شهوراً","دقائق","يوماً واحداً"], correct:0,
     hints:{1:"الجمال تمشي ببطء في طريق طويل… هل تكفي دقائق؟",2:"الطريق طويل جداً… فكّري في مدة أطول بكثير."},
     why:"قديماً كان التبادل التجاري يستغرق شهوراً (ص101)."},
    {type:"mcq", icon:"✈️", title:"اليوم: السفينة والطائرة", lead:"اليوم تحمل السفن والطائرات السلع بين الدول.",  art:"ship",
     q:"لماذا أصبح التبادل التجاري اليوم سريعاً؟",
     options:["لتوافر وسائل المواصلات الحديثة والتقنيات الجديدة","لأن الناس عادوا إلى المقايضة","لأن السلع صارت قليلة"], correct:0,
     hints:{1:"المقايضة طريقة قديمة… وما الذي تغيّر في وسائل النقل؟",2:"انظري إلى السفينة والطائرة… ما الذي يجعل الرحلة أسرع؟"},
     why:"أصبح التبادل التجاري سريعاً؛ نتيجة توافر وسائل المواصلات الحديثة والتقنيات الجديدة (ص101)."},
    {type:"drag", icon:"📦", title:"صناديق تصل إلى وطننا", lead:"وصلت سفينة إلى "+PORT+". اسحبي كل صندوق إلى سلته (أو المسيه ثم المسي السلة).",  leaving:false,
     boxes:[{e:"🍎",n:"فواكه",to:"get"},{e:"🥕",n:"خضراوات",to:"get"},{e:"💻",n:"أجهزة إلكترونية",to:"use"},{e:"🚗",n:"سيارات",to:"use"}],
     hint:{get:"هذه المنتجات تصنعها مصانع في دول أخرى… فماذا نفعل بصناعاتهم؟", use:"هذه منتجات يصعب توافرها في وطننا… هل هي صناعة أم منتجات نحصل عليها؟", sell:"هذا الصندوق يصل إلى وطننا، لا يخرج منه! هل نبيعه أم نشتريه من دول أخرى؟"}},
    {type:"drag", icon:"🌴", title:"صناديق تخرج من وطننا", lead:"سفينة تغادر "+PORT+" إلى دول أخرى. اسحبي كل صندوق إلى سلته.",  leaving:true,
     boxes:[{e:"🌴",n:"تمور",to:"sell"},{e:"🛢️",n:"النفط ومشتقاته",to:"sell"}],
     hint:{get:"هذا الصندوق يخرج من وطننا على السفينة… هل نحن نشتريه أم نبيعه؟", use:"هذا من إنتاج وطننا، لا من صناعات دول أخرى… فماذا نفعل به؟"},
     after:"ما فائدة التبادل التجاري لوطننا؟", afterAns:"تعتمد الدول على التبادل التجاري من أجل تنمية اقتصادها (ص101)."},
    {type:"golden", icon:"🧺", title:"السؤال الذهبي: سلة من الدمام", lead:"منتجات من شركات أغذية سعودية كبرى، وعبواتها الحقيقية في يد معلمتك. اقرئي الملصق: أين صُنعت هذه العبوة؟"},
    {type:"end"}
  ];

  var cur = 0, done = {}, golden = PRODUCTS.map(function(){ return {}; });
  var dragState = {};

  function setFeedback(msg, kind){ var f=$("feedback"); f.className="feedback"+(msg?" show "+kind:""); f.textContent=msg; if(msg){ setTimeout(function(){ f.scrollIntoView({block:"nearest",behavior:"smooth"}); },30); } }

  function renderSteps(){
    var s=$("steps"); s.innerHTML="";
    for(var i=1;i<=5;i++){ var d=document.createElement("span"); d.textContent=i; if(i===cur) d.className="on"; else if(done[i]) d.className="done"; s.appendChild(d); }
  }

  function go(i){
    cur = Math.max(0, Math.min(SCENES.length-1, i));
    setFeedback("", "");
    render();
    window.scrollTo(0,0);
  }

  function head(sc){
    return '<div class="scene-head"><h2>'+sc.icon+' المشهد '+cur+': '+sc.title+'</h2></div><p class="lead">'+sc.lead+'</p>';
  }

  function render(){
    var sc = SCENES[cur], st = $("stage");
    renderSteps();
    $("prevBtn").style.visibility = cur===0 ? "hidden" : "visible";
    $("nextBtn").style.visibility = cur===SCENES.length-1 ? "hidden" : "visible";
    $("nextBtn").textContent = cur===0 ? "ابدئي الرحلة ⬅️" : (cur===SCENES.length-2 ? "نهاية الرحلة ⬅️" : "التالي ⬅️");
    $("nextBtn").classList.toggle("pulse", !!done[cur] || cur===0);
    if(sc.type==="start"){
      st.innerHTML = '<section class="card" style="text-align:center">'+pic(ART.start, "scene-pic")+'<h1>رحلة صناديق الميناء</h1><p class="lead">سوقنا يكبر ويصير بين الدول! نتبع سلة التاجرة الصغيرة من القافلة القديمة إلى '+PORT+'، ثم إلى بيتها في الدمام.</p><p class="small">خمسة مشاهد · الهدف 4: تستنتج فوائد التبادل التجاري بين الدول.</p></section>';
    } else if(sc.type==="mcq"){ renderMcq(sc, st); }
    else if(sc.type==="drag"){ renderDrag(sc, st); }
    else if(sc.type==="golden"){ renderGolden(sc, st); }
    else { renderEnd(st); }
  }

  /* ---------- multiple choice ---------- */
  function renderMcq(sc, st){
    var state = done[cur] ? {resolved:true} : {attempts:0, resolved:false};
    st.innerHTML = '<section class="card">'+head(sc)+pic(ART[sc.art], "scene-pic")+'<div class="q">'+sc.q+'</div><div class="opts" id="opts"></div></section>';
    var box = $("opts");
    sc.options.forEach(function(o,i){
      var b=document.createElement("button"); b.className="opt"; b.type="button"; b.dataset.i=i;
      b.innerHTML='<span class="letter">'+LETTERS[i]+'</span><span class="ot"></span><span class="mark"></span>';
      b.querySelector(".ot").textContent=o;
      b.addEventListener("click", function(){ pick(i); });
      box.appendChild(b);
    });
    if(state.resolved){ finish(); setFeedback("✔ "+sc.why, "ok"); }
    function pick(i){
      if(state.resolved) return;
      if(i===sc.correct){ finish(); setFeedback("✔ صحيح! "+sc.why, "ok"); return; }
      state.attempts++;
      var b=box.children[i]; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      if(state.attempts>=2){ finish(); setFeedback("الإجابة الصحيحة: "+LETTERS[sc.correct]+") "+sc.options[sc.correct]+". "+sc.why, "ok"); return; }
      setFeedback("✘ حاولي مرة أخرى: "+(sc.hints[i]||"فكّري مرة أخرى."), "bad");
    }
    function finish(){
      state.resolved=true; done[cur]=true;
      Array.prototype.forEach.call(box.children,function(b){ b.disabled=true; if(+b.dataset.i===sc.correct){ b.classList.add("right"); b.querySelector(".mark").textContent="✔"; } });
      renderSteps(); $("nextBtn").classList.add("pulse");
    }
  }

  /* ---------- drag & drop (pointer events on window + tap fallback) ---------- */
  function renderDrag(sc, st){
    var key = "s"+cur;
    if(!dragState[key]) dragState[key] = {placed:{}, tries:{}};
    var ds = dragState[key];
    var html = '<section class="card">'+head(sc)+pic(ART.port(sc.leaving), "port-pic")+
      '<div class="caption">⚓ '+PORT+(sc.leaving ? " · 🚢 ⬅️ إلى دول أخرى" : " · 🚢 وصلت من دول أخرى")+'</div>'+
      '<div class="boxes" id="boxes"></div><div class="baskets" id="baskets"></div>';
    if(sc.after) html += '<div id="after" class="hidden" style="margin-top:.6em"><div class="q">'+sc.after+'</div><button class="btn outline" id="afterBtn">اكشفي الإجابة</button><div id="afterAns" class="feedback"></div></div>';
    html += '</section>';
    st.innerHTML = html;
    var bWrap=$("baskets");
    BASKETS.forEach(function(b){
      var d=document.createElement("div"); d.className="basket "+b.cls; d.dataset.id=b.id;
      d.innerHTML='<svg class="bimg" viewBox="0 0 100 74" aria-hidden="true"><use href="#basket"/></svg><div><div class="t">'+b.t+'</div><div class="s">'+b.s+'</div></div><div class="in"></div>';
      d.addEventListener("click", function(){ if(picked!==null) dropOn(picked, b.id); });
      bWrap.appendChild(d);
    });
    var picked = null;
    var boxWrap=$("boxes");
    sc.boxes.forEach(function(bx, i){
      if(ds.placed[i]){ addToBasket(bx); return; }
      var el=document.createElement("div"); el.className="boxitem"; el.dataset.i=i; el.setAttribute("role","button"); el.setAttribute("tabindex","0");
      el.innerHTML='<span class="carton"><svg viewBox="0 0 64 54" aria-hidden="true"><use href="#carton"/></svg><span class="e">'+bx.e+'</span></span><span>'+bx.n+'</span>';
      attachDrag(el, i);
      boxWrap.appendChild(el);
    });
    checkComplete();

    function addToBasket(bx){
      var b = bWrap.querySelector('[data-id="'+bx.to+'"] .in');
      var s=document.createElement("span"); s.textContent=bx.e+" "+bx.n; b.appendChild(s);
    }
    function dropOn(i, bid){
      var bx = sc.boxes[i], el = boxWrap.querySelector('[data-i="'+i+'"]');
      if(!el) return;
      el.classList.remove("picked"); picked=null;
      if(bid===bx.to){
        ds.placed[i]=true; el.remove(); addToBasket(bx);
        setFeedback("✔ صحيح! "+WHY[bx.to], "ok");
        checkComplete(); return;
      }
      ds.tries[i]=(ds.tries[i]||0)+1;
      el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
      if(ds.tries[i]>=2){
        ds.placed[i]=true; el.remove(); addToBasket(bx);
        var name = BASKETS.filter(function(b){return b.id===bx.to;})[0].t;
        setFeedback("مكانه الصحيح: "+name+". "+WHY[bx.to], "ok");
        checkComplete(); return;
      }
      setFeedback("✘ حاولي مرة أخرى: "+(sc.hint[bid]||"فكّري مرة أخرى."), "bad");
    }
    function checkComplete(){
      var all = sc.boxes.every(function(_,i){ return ds.placed[i]; });
      if(all){
        done[cur]=true; renderSteps(); $("nextBtn").classList.add("pulse");
        if(sc.after){ $("after").classList.remove("hidden");
          $("afterBtn").onclick=function(){ var a=$("afterAns"); a.className="feedback show ok"; a.textContent="✔ "+sc.afterAns; };
        }
      }
    }
    function attachDrag(el, i){
      var startX=0, startY=0, moving=false, clone=null, lastOver=null, pid=null;
      /* move/up are listened on window so the drop works with mouse, pen and touch even without pointer capture */
      el.addEventListener("pointerdown", function(e){
        if(e.button!==undefined && e.button!==0) return;
        if(pid!==null) return;
        pid=e.pointerId; startX=e.clientX; startY=e.clientY; moving=false;
        window.addEventListener("pointermove", onMove, {passive:false});
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onCancel);
        e.preventDefault();
      });
      function detach(){
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onCancel);
      }
      function onUp(e){ end(e,false); }
      function onCancel(e){ end(e,true); }
      function onMove(e){
        if(pid!==e.pointerId) return;
        var dx=e.clientX-startX, dy=e.clientY-startY;
        if(!moving && (dx*dx+dy*dy)>64){
          moving=true; clone=el.cloneNode(true); clone.classList.add("dragclone"); clone.classList.remove("picked","shake");
          document.body.appendChild(clone); el.classList.add("placeholder");
        }
        if(moving){
          clone.style.left=e.clientX+"px"; clone.style.top=e.clientY+"px";
          var over = basketAt(e.clientX, e.clientY);
          if(over!==lastOver){ if(lastOver) lastOver.classList.remove("over"); if(over) over.classList.add("over"); lastOver=over; }
          e.preventDefault();
        }
      }
      function end(e, cancelled){
        if(pid!==e.pointerId) return;
        pid=null; detach();
        if(moving){
          var over = cancelled ? null : basketAt(e.clientX, e.clientY);
          if(clone) clone.remove(); clone=null; el.classList.remove("placeholder");
          if(lastOver) lastOver.classList.remove("over"); lastOver=null;
          moving=false;
          if(over) dropOn(i, over.dataset.id);
        } else if(!cancelled){
          if(picked===i){ el.classList.remove("picked"); picked=null; setFeedback("", ""); }
          else{
            var prev = picked!==null ? boxWrap.querySelector('[data-i="'+picked+'"]') : null; if(prev) prev.classList.remove("picked");
            picked=i; el.classList.add("picked"); setFeedback("اخترتِ «"+sc.boxes[i].n+"»… الآن المسي السلة المناسبة.", "hint");
          }
        }
      }
      el.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); picked=i; el.classList.add("picked"); setFeedback("اخترتِ «"+sc.boxes[i].n+"»… الآن اختاري السلة.", "hint"); } });
    }
    function basketAt(x,y){
      var els = document.elementsFromPoint ? document.elementsFromPoint(x,y) : [document.elementFromPoint(x,y)];
      for(var k=0;k<els.length;k++){ var b = els[k] && els[k].closest ? els[k].closest(".basket") : null; if(b) return b; }
      return null;
    }
  }

  /* ---------- golden question ---------- */
  function renderGolden(sc, st){
    st.innerHTML = '<section class="card">'+head(sc)+'<div class="products" id="products"></div><p class="small">الحكم من الملصق الحقيقي، ومعلمتك تتحقق منه. الشركة سعودية، ومكان صنع كل عبوة يُقرأ من ملصقها.</p></section>';
    var wrap=$("products");
    golden.forEach(function(g, i){
      var p = PRODUCTS[i];
      var d=document.createElement("div"); d.className="product";
      var svg='<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="none"/><use href="#'+p.art+'" x="40" y="6" width="80" height="110"/></svg>';
      var info = p.open
        ? '<div class="co">منتج آخر من مطبخك</div><input type="text" maxlength="40" placeholder="اكتبي اسم المنتج">'
        : '<div class="co">🏭 '+p.co+' (شركة سعودية)</div><div class="item">المنتج: '+p.item+'</div>';
      d.innerHTML = pic(svg)+info+
        '<div class="row step1"><button type="button" data-a="ksa">🌴 صُنع في المملكة</button><button type="button" data-a="other">🌍 صُنع في بلد آخر</button></div>'+
        '<div class="row step2 hidden"><button type="button" data-a="get">📥 نحصل</button><button type="button" data-a="use">🔧 نستفيد</button></div>'+
        '<div class="msg"></div><button type="button" class="btn outline redo hidden" style="min-height:44px;font-size:.7em">إعادة</button>';
      var inp=d.querySelector("input"), s1=d.querySelector(".step1"), s2=d.querySelector(".step2"), msg=d.querySelector(".msg"), redo=d.querySelector(".redo");
      if(inp){ inp.value = g.name || ""; inp.addEventListener("input", function(){ g.name=inp.value; }); }
      function paint(){
        s1.classList.toggle("hidden", !!g.origin);
        s2.classList.toggle("hidden", g.origin!=="other" || !!g.basket);
        redo.classList.toggle("hidden", !g.origin);
        msg.className="msg"; msg.textContent="";
        if(g.origin==="ksa"){ msg.className="msg ok"; msg.textContent="✔ صناعة سعودية! نختاره دعماً لاقتصاد وطننا (ص102)، ونبيع إنتاجنا الوطني لدول أخرى (ص101)."; }
        else if(g.origin==="other" && !g.basket){ msg.textContent = p.open ? "جاءنا من بلد آخر… في أي سلة نضعه؟" : "الشركة سعودية، لكن الملصق يقول إن هذه العبوة صُنعت في بلد آخر… في أي سلة نضعها؟"; }
        else if(g.basket){ msg.className="msg ok"; msg.textContent="✔ "+(g.basket==="get" ? "حصلنا عليه من بلد آخر بالتبادل التجاري (ص101)." : "استفدنا من صناعة بلد آخر بالتبادل التجاري (ص101)."); }
        var all = golden.every(function(x, k){ return PRODUCTS[k].open || x.origin==="ksa" || !!x.basket; });
        if(all){ done[cur]=true; renderSteps(); $("nextBtn").classList.add("pulse"); }
      }
      s1.addEventListener("click", function(e){ var a=e.target.closest("button"); if(!a) return; g.origin=a.dataset.a; paint(); });
      s2.addEventListener("click", function(e){ var a=e.target.closest("button"); if(!a) return; g.basket=a.dataset.a; paint(); });
      redo.addEventListener("click", function(){ g.origin=null; g.basket=null; paint(); });
      paint();
      wrap.appendChild(d);
    });
  }

  function renderEnd(st){
    var lists = {get:[], use:[], sell:[]}, ksa = [];
    [3,4].forEach(function(si){ SCENES[si].boxes.forEach(function(b){ lists[b.to].push(b.e+" "+b.n); }); });
    golden.forEach(function(g,i){
      var p = PRODUCTS[i];
      var n = p.open ? (g.name || "منتج من المطبخ") : (p.item+" ("+p.co+")");
      if(g.origin==="ksa") ksa.push("🧺 "+n); else if(g.basket) lists[g.basket].push("🧺 "+n);
    });
    var html = '<section class="card" style="text-align:center"><h1>انتهت الرحلة! 🎉</h1><p class="lead">تعتمد الدول على التبادل التجاري من أجل تنمية اقتصادها (ص101).</p><div class="summary">';
    BASKETS.forEach(function(b){ html += '<div style="background:var(--'+b.cls+')"><svg viewBox="0 0 100 74" width="56" aria-hidden="true"><use href="#basket"/></svg><br><strong>'+b.t+'</strong><div class="small">'+b.s+'</div><div>'+lists[b.id].map(escapeHtml).join("<br>")+'</div></div>'; });
    html += '</div>';
    if(ksa.length) html += '<p><strong>🌴 من سلة الدمام، صناعة سعودية:</strong> '+ksa.map(escapeHtml).join(" · ")+'</p>';
    html += '<p></p><button class="btn outline" id="restart">رحلة جديدة</button></section>';
    st.innerHTML = html;
    $("restart").onclick=function(){ done={}; dragState={}; golden=PRODUCTS.map(function(){ return {}; }); go(0); };
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  $("nextBtn").addEventListener("click", function(){ go(cur+1); });
  $("prevBtn").addEventListener("click", function(){ go(cur-1); });
  document.addEventListener("keydown", function(e){
    if(e.target && e.target.tagName==="INPUT") return;
    if(e.code==="KeyN" || e.code==="PageDown") go(cur+1);
    if(e.code==="KeyP" || e.code==="PageUp") go(cur-1);
  });
  render();
})();
</script>
</body>
</html>
